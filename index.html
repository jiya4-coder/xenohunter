<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyBot AI — Your AI-Powered Personal Study Companion</title>
    <meta name="description" content="All-in-one AI study workspace: tutor, mock tests, NCERT solutions, flashcards, revision, and planner for classes 6–12." />
    <meta property="og:title" content="StudyBot AI — Your AI-Powered Personal Study Companion" />
    <meta property="og:description" content="All-in-one AI study workspace: tutor, mock tests, NCERT solutions, flashcards, revision, and planner for classes 6–12." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#100f1c] text-[#ecebfa] min-h-screen selection:bg-purple-600/30 selection:text-white antialiased">
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            for (var i = localStorage.length - 1; i >= 0; i--) {
              var k = localStorage.key(i);
              if (k && (k.indexOf('firebase:authUser') !== -1 || k.indexOf('firebase:installations') !== -1)) {
                try {
                  var v = JSON.parse(localStorage.getItem(k) || '{}');
                  if (v && v.isAnonymous) {
                    localStorage.removeItem(k);
                  }
                } catch(e) {
                  localStorage.removeItem(k);
                }
              }
            }
            if (window.indexedDB) {
              window.indexedDB.deleteDatabase('firebaseLocalStorageDb');
            }
          }
        } catch (_) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
